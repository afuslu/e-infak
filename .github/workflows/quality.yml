name: Quality gates

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: einfak
          POSTGRES_PASSWORD: einfak123
          POSTGRES_DB: einfak_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U einfak -d einfak_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - uses: pnpm/action-setup@v4
        with: { version: 8.15.0 }
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: pnpm --filter @e-infak/web type-check
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r services/backend/requirements.txt
      - run: pip install pip-audit && pip-audit -r services/backend/requirements.txt
      - run: cd services/backend && pytest -q
        env:
          DATABASE_URL: postgresql+asyncpg://einfak:einfak123@localhost:5432/einfak_test
          SECRET_KEY: test-secret-key-at-least-32-characters
      - run: cd services/backend && python -m compileall -q app
