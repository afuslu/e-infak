# E-İnfak — nginx site (server-setup.sh installs it as /etc/nginx/sites-available/e-infak.conf).
# Only the server names below are handled here; other sites on the server are untouched.
# deploy.sh switches blue/green by rewriting the two upstream include files.

upstream einfak_backend {
    include /etc/nginx/e-infak/backend-active.conf;
    keepalive 16;
}

upstream einfak_frontend {
    include /etc/nginx/e-infak/frontend-active.conf;
    keepalive 16;
}

# Internal, stable API address for the Next.js server (INTERNAL_API_URL),
# independent of which blue/green port is active. Not reachable from outside.
server {
    listen 127.0.0.1:8090;
    server_name _;
    client_max_body_size 8m;

    location / {
        proxy_pass http://einfak_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Set by the public server block below and passed on by the web gateway.
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAMES__;
    client_max_body_size 8m;

    # Payment provider callbacks and uploaded images go straight to the API.
    location ^~ /api/v1/payments/ {
        proxy_pass http://einfak_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location ^~ /api/v1/media/ {
        proxy_pass http://einfak_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        expires 7d;
    }

    location = /health {
        proxy_pass http://einfak_backend;
        proxy_set_header Host $host;
    }

    # Everything else (pages and /api/v1/* through the signed web gateway).
    location / {
        proxy_pass http://einfak_frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
